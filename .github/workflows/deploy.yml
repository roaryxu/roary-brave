name: Publish Roary static site

on:
  push:
    branches: [main]
    paths:
      - site.zip
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the approved repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unpack the reviewed static site
        shell: bash
        run: |
          set -euo pipefail
          sha256sum site.zip
          mkdir -p _site
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/.nojekyll
          test ! -e _site/manifest.json

      # Enable Pages in the repository UI first. Automatic enablement would
      # require an additional token; the default here uses github.token only.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the static directory as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/
          include-hidden-files: true
          retention-days: 1

      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
